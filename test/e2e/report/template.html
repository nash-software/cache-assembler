<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>cache-assembler E2E report</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 2rem;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 {
    font-size: 1.5rem;
    border-bottom: 2px solid #333;
    padding-bottom: 0.5rem;
  }
  h2 {
    font-size: 1.15rem;
    margin-top: 2rem;
  }
  h3 {
    font-size: 1rem;
    margin-top: 1.5rem;
    color: #444;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.5rem 0 1.5rem;
    background: #fff;
  }
  th, td {
    border: 1px solid #ddd;
    padding: 0.4rem 0.6rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child {
    text-align: left;
  }
  th {
    background: #f0f0f0;
  }
  .chart-wrap {
    background: #fff;
    border: 1px solid #ddd;
    padding: 0.75rem;
    margin: 0.5rem 0 1.5rem;
  }
  .note {
    color: #777;
    font-style: italic;
  }
  .harness-block {
    margin-bottom: 3rem;
    padding-bottom: 1rem;
    border-bottom: 1px dashed #ccc;
  }
  .bar-label {
    font-size: 11px;
    fill: #1a1a1a;
  }
  .bar-value {
    font-size: 10px;
    fill: #1a1a1a;
  }
</style>
</head>
